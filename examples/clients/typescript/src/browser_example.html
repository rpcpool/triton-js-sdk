<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Triton Account Sync Browser Example</title>
  </head>
  <body>
    <h1>Live account data</h1>
    <p>Set RPC_ENDPOINT in this file to your account-sync endpoint, then reload.</p>
    <pre id="output">Waiting for account data...</pre>
    <script type="module">
      import { Connection, PublicKey } from "https://esm.sh/@triton-one/triton-sdk@0.1.0?bundle&conditions=browser";

      const RPC_ENDPOINT = "https://example.com/yourToken";
      const ACCOUNT = "ping6gwBZx1ccMMFyLgkVSupUmujYrFidEXuNRPq989";
      const account = new PublicKey(ACCOUNT);
      const connection = new Connection(RPC_ENDPOINT, {
        accountSync: {
          transport: "ws",
          commitment: "confirmed",
          initialAccounts: [account],
        },
      });
      const output = document.getElementById("output");

      while (true) {
        const response = await connection.getAccountInfoAndContext(account);
        output.textContent = JSON.stringify(response, null, 2);
        await new Promise((resolve) => setTimeout(resolve, 500));
      }
    </script>
  </body>
</html>
