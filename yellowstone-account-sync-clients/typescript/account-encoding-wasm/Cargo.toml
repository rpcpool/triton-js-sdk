[package]
name = "yellowstone-account-sync-account-encoding-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
bs58 = "=0.5.1"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
solana-account = "=3.0.0"
solana-account-decoder = "=3.0.0"
solana-account-decoder-client-types = { version = "=3.0.0", features = ["zstd"] }
solana-program-pack = "=3.0.0"
solana-pubkey = { version = "=3.0.0", default-features = false }
spl-token-2022-interface = "=2.0.0"
thiserror = "=2.0.17"
wasm-bindgen = "=0.2.100"

[profile.release]
lto = true
codegen-units = 1
